<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Portfolio | Toopeace</title>
    <link rel="stylesheet" href="./styles.css?v=20260904-multipage" />
    <script src="./app.js?v=20260904-multipage" defer></script>
  </head>
  <body>
    <a class="tp-home-link" href="./index.html" aria-label="Toopeace 홈으로">TOOPEACE</a>
    <nav class="tp-primary-nav tp-primary-nav--floating" aria-label="주요 메뉴">
      <a class="tp-primary-nav-link" href="./portfolio.html" aria-current="page">Portfolio</a>
      <a class="tp-primary-nav-link" href="./story.html">Story</a>
      <a class="tp-primary-nav-link" href="./services.html">Services</a>
    </nav>

    <main class="tp-subpage tp-subpage--portfolio">
      <section class="tp-results" id="portfolio" aria-labelledby="results-title">
        <div class="tp-results-heading">
          <p class="tp-eyebrow">REAL WORK, REAL CHANGE</p>
          <h1 id="results-title">투피스에이전시와 함께한 사람들은 이렇게 바뀌었습니다</h1>
          <p>좋은 본질이 실제 업무와 결과로 이어지는<br class="tp-br-mobile" /> 과정을 기록합니다.</p>
        </div>

        <div class="tp-portfolio-carousel" data-portfolio-carousel tabindex="0" aria-label="포트폴리오 캐러셀">
          <div class="tp-portfolio-stage">
            <button class="tp-carousel-arrow tp-carousel-arrow--prev" type="button" data-carousel-prev aria-label="이전 포트폴리오">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14 5-7 7 7 7" /></svg>
            </button>
            <div class="tp-portfolio-viewport">
              <div class="tp-portfolio-track" data-carousel-track></div>
            </div>
            <button class="tp-carousel-arrow tp-carousel-arrow--next" type="button" data-carousel-next aria-label="다음 포트폴리오">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m10 5 7 7-7 7" /></svg>
            </button>
          </div>
          <div class="tp-carousel-dots" data-carousel-dots aria-label="포트폴리오 선택"></div>
          <article class="tp-portfolio-detail" aria-live="polite">
            <p class="tp-portfolio-detail-category" data-portfolio-category></p>
            <h2 data-portfolio-title></h2>
            <div class="tp-portfolio-results">
              <p class="tp-portfolio-results-label">성과</p>
              <ul data-portfolio-results></ul>
            </div>
          </article>
          <div class="tp-portfolio-detail-media" data-portfolio-media>
            <figure data-portfolio-before hidden><figcaption>Before</figcaption><img src="" alt="" /></figure>
            <figure data-portfolio-after hidden><figcaption>After</figcaption><img src="" alt="" /></figure>
          </div>
        </div>

        <div class="tp-results-outro">
          <div class="tp-results-outro-dots" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="tp-results-outro-copy">이밖에도 저희를 거쳐간 분들의 성과는<br />계속해서 쏟아져 나오고 있습니다</p>
          <div class="tp-results-outro-media">
            <img src="./assets/results-collage.png" alt="투피스에이전시를 거쳐간 채널들의 인기 콘텐츠 조회수 성과 모음" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
