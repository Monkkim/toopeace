<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Toopeace</title>
  <link rel="stylesheet" href="./styles.css?v=20260907-mobile-top" />
    <script src="./app.js?v=20260907-contact-nav" defer></script>
  </head>
  <body>
    <nav class="tp-primary-nav tp-primary-nav--floating" aria-label="주요 메뉴">
      <a class="tp-primary-nav-link" href="./portfolio.html">Portfolio</a>
      <a class="tp-primary-nav-link" href="./story.html">Education</a>
      <a class="tp-primary-nav-link" href="./index.html#contact">Contact</a>
    </nav>

    <main class="toopeace-wrap" aria-labelledby="page-title">
      <h1 id="page-title" class="visually-hidden">Toopeace</h1>

      <svg
        class="tp-svg-text"
        viewBox="0 0 1000 100"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-label="TOOPEACE"
      >
        <path data-l="T" d="M 0 0 L 100 0 M 50 0 L 50 100" />
        <circle data-l="O1" cx="175" cy="50" r="46" />
        <circle data-l="O2" cx="300" cy="50" r="46" />
        <path data-l="P" d="M 375 0 L 375 100 M 375 0 C 490 0 490 60 375 60" />
        <path data-l="E1" d="M 500 0 L 500 100 M 500 0 L 600 0 M 500 50 L 600 50 M 500 100 L 600 100" />
        <path data-l="A" d="M 625 100 L 675 0 L 725 100 M 645 60 L 705 60" />
        <path data-l="C" d="M 823 10 A 46 46 0 1 0 823 90" />
        <path data-l="E2" d="M 875 0 L 875 100 M 875 0 L 975 0 M 875 50 L 975 50 M 875 100 L 975 100" />
      </svg>

      <section class="tp-mission" aria-label="투피스에이전시 소개">
        <p class="tp-mission-copy">
          투피스 에이전시는 '고객사를 빛낸다'라는 사명 아래,<br />
          좋은 본질이 세상에 알려지지 못해 사라지는 일이 없도록<br />
          그 가치를 가장 빛나는 방식으로 전합니다
        </p>
        <div class="tp-hero-socials" aria-label="투피스 채널">
          <a class="tp-hero-social" data-platform="instagram" href="https://www.instagram.com/toopeace_r/" target="_blank" rel="noreferrer" aria-label="Instagram @toopeace">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="instagram-brand" x1="0" y1="1" x2="0.8" y2="0">
                  <stop offset="0%" stop-color="#ffdc80" />
                  <stop offset="25%" stop-color="#fcaf45" />
                  <stop offset="50%" stop-color="#f56040" />
                  <stop offset="75%" stop-color="#dd2a7b" />
                  <stop offset="100%" stop-color="#a020f0" />
                </linearGradient>
              </defs>
              <rect class="tp-instagram-outline" x="2.5" y="2.5" width="19" height="19" rx="5.5" />
              <circle class="tp-instagram-outline" cx="12" cy="12" r="4.5" />
              <circle cx="18" cy="6" r="1.3" class="tp-instagram-dot" />
            </svg>
            <span class="tp-hero-social-handle">@toopeace</span>
          </a>
          <a class="tp-hero-social" data-platform="youtube" href="https://www.youtube.com/@%ED%88%AC%ED%94%BC%EC%8A%A4-toopeace" target="_blank" rel="noreferrer" aria-label="YouTube @toopeace">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path class="tp-youtube-body" d="M23 7.1a3 3 0 0 0-2.1-2.2C19 4.4 12 4.4 12 4.4s-7 0-8.9.5A3 3 0 0 0 1 7.1C.5 9 .5 12 .5 12s0 3 .5 4.9a3 3 0 0 0 2.1 2.2c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.2c.5-1.9.5-4.9.5-4.9s0-3-.5-4.9Z" />
              <path d="m9.6 8.4 6.2 3.6-6.2 3.6Z" class="tp-youtube-play" />
            </svg>
            <span class="tp-hero-social-handle">@toopeace</span>
          </a>
          <a class="tp-hero-social" data-platform="blog" href="https://blog.naver.com/apple1003_/224295485682" target="_blank" rel="noreferrer" aria-label="Blog @toopeace">
            <svg class="tp-blog-brand" viewBox="100 88 312 337" aria-hidden="true" focusable="false">
              <image href="./assets/blog-brand.png" width="512" height="512" />
            </svg>
            <span class="tp-hero-social-handle">@toopeace</span>
          </a>
        </div>
      </section>

      <button class="tp-contact" type="button" data-contact-modal-open aria-label="Contact">
        <span class="tp-morph-icon-wrap" aria-hidden="true">
          <span class="tp-morph-icon tp-morph-icon--send">
            <svg viewBox="0 0 24 24" focusable="false"><path d="m4 4 16 8-16 8 3-8-3-8Z" /><path d="M7 12h13" /></svg>
          </span>
          <span class="tp-morph-icon tp-morph-icon--check">
            <svg viewBox="0 0 24 24" focusable="false"><path d="m5 12 4 4L19 6" /></svg>
          </span>
        </span>
        <span class="tp-contact-label">Contact</span>
      </button>

    </main>

    <dialog class="tp-contact-modal" id="contact-modal" aria-labelledby="contact-modal-title">
      <form class="tp-modal-form">
        <button class="tp-modal-close" type="button" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6 18 18 M18 6 6 18" />
          </svg>
        </button>

        <div class="tp-modal-body">
          <p class="tp-modal-eyebrow">CONTACT</p>
          <h2 id="contact-modal-title">문의하기</h2>
          <p class="tp-modal-desc">
            연락처를 남겨주시면 확인 후<br class="tp-br-mobile" />
            빠르게 연락드리겠습니다
          </p>

          <label class="tp-modal-field">
            <span>이름</span>
            <input name="name" type="text" required autocomplete="name" placeholder="이름을 입력해주세요" />
          </label>
          <label class="tp-modal-field">
            <span>연락처</span>
            <input name="phone" type="tel" required autocomplete="tel" placeholder="010-0000-0000" />
          </label>
          <label class="tp-modal-field">
            <span>이메일</span>
            <input name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
          </label>

          <button class="tp-modal-submit" type="submit">문의 보내기</button>
        </div>

        <div class="tp-modal-success" hidden>
          <p class="tp-modal-eyebrow">THANK YOU</p>
          <h2>문의가 접수되었습니다</h2>
          <p class="tp-modal-desc">확인 후 빠른 시일 내에<br class="tp-br-mobile" /> 연락드리겠습니다</p>
          <button class="tp-modal-submit tp-modal-success-close" type="button">닫기</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
